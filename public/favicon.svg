<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Konstantinos Lianos">
    <circle cx="32" cy="32" r="32" fill="#2dd4bf" />
    <!-- "Code K": a stem plus an angle bracket, read as |<. Drawn as shapes, not <text>,
         so it renders identically everywhere. -->
    <rect x="15" y="16" width="7" height="32" fill="#101416" />
    <polyline points="47,17 32,32 47,47" fill="none" stroke="#101416" stroke-width="7" stroke-linejoin="miter" />
</svg>
