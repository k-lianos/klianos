name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# Let a queued run supersede an in-progress one, but never cancel a deploy midway.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # Keep this major in step with the `engines` field in package.json.
            - uses: actions/setup-node@v4
              with:
                  node-version: 26
                  cache: npm

            # husky's prepare script is pointless in CI and only installs hooks.
            - run: npm ci --ignore-scripts

            - run: npm run build

            # vnu.jar (the W3C Nu HTML checker) needs Java 17 or newer.
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21

            # Fails the job on any W3C error, so invalid HTML never deploys. The filtered info note fires on every
            # `<meta />` that Prettier writes; it is not an error.
            - name: Validate HTML
              run: >-
                  java -jar node_modules/vnu-jar/build/dist/vnu.jar
                  --skip-non-html --format gnu
                  --filterpattern '.*Trailing slash on void elements.*'
                  dist/

            - uses: actions/configure-pages@v5

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
