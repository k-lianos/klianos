name: Build and deploy

# Pull requests run the same build job that gates a deploy, but never deploy. The `build` job is the required status check on `main`.
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

# Jobs grant themselves what they need, so pull-request runs never hold Pages permissions.
permissions: {}

# A newer push to a pull request cancels its older run. On `main` runs queue instead: a deploy is never cancelled midway.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7

            # Keep this major in step with the `engines` field in package.json.
            - uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: npm

            # husky's prepare script is pointless in CI and only installs hooks.
            - run: npm ci --ignore-scripts

            - run: npm run build

            # vnu.jar (the W3C Nu HTML checker) needs Java 17 or newer.
            - uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: 21

            # Fails the job on any W3C error, so invalid HTML never deploys. The filtered info note fires on every
            # `<meta />` that Prettier writes; it is not an error.
            - name: Validate HTML
              run: >-
                  java -jar node_modules/vnu-jar/build/dist/vnu.jar
                  --skip-non-html --format gnu
                  --filterpattern '.*Trailing slash on void elements.*'
                  dist/

            # Tier 1: check asset resolution, JSON-LD, meta tags, no-JS rule, page weight.
            - name: Check dist
              run: npm run check-dist

            # Tier 2: browser geometry tests (overflow, sticky header, anchor offset, accordion, reduced motion).
            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Run Playwright tests
              run: npm test

            - if: github.event_name != 'pull_request'
              uses: actions/configure-pages@v6

            - if: github.event_name != 'pull_request'
              uses: actions/upload-pages-artifact@v5
              with:
                  path: dist

    deploy:
        if: github.event_name != 'pull_request'
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5

            # Runs against the live site: the only way to catch a GitHub Pages
            # misconfiguration (broken CNAME, failed artifact upload, wrong base path).
            # Checks the page, stable public/ assets, hashed CSS and portrait bundles,
            # and the Commissioner Variable font extracted from the stylesheet.
            - name: Smoke test
              env:
                  BASE: ${{ steps.deployment.outputs.page_url }}
              run: |
                  BASE="${BASE%/}"
                  FAIL=0
                  check() {
                    local code
                    code=$(curl -sSo /dev/null -w '%{http_code}' --max-time 10 "$1")
                    if [ "$code" = "200" ]; then echo "  200  $1"
                    else echo "  FAIL ($code)  $1" >&2; FAIL=$((FAIL+1)); fi
                  }
                  check "$BASE/"
                  check "$BASE/og-image.jpg"
                  check "$BASE/sitemap.xml"
                  check "$BASE/favicon.svg"
                  HTML=$(curl -sS --max-time 10 "$BASE/")
                  for path in $(printf '%s' "$HTML" | grep -oE '"(/assets/[^"]+\.(css|jpg))"' | tr -d '"' | sort -u); do
                    check "$BASE$path"
                  done
                  CSS=$(printf '%s' "$HTML" | grep -oE '/assets/[^"]+\.css' | head -1)
                  FONT=$([ -n "$CSS" ] && curl -sS --max-time 10 "$BASE$CSS" | grep -oE '/assets/commissioner-variable[^)]+\.woff2' | head -1 || true)
                  [ -n "$FONT" ] && check "$BASE$FONT"
                  [ "$FAIL" = 0 ] && echo 'all checks passed' || { echo "$FAIL check(s) failed" >&2; exit 1; }
